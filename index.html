<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieFinder</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/icon.png" type="image/png" />
  </head>
  <body>
    <header>
      <img id="headerLogo" src="assets/icon.png" alt="" />
      <div class="headerText">Movie<span id="Finder">Finder</span></div>
      <button class="theme-toggle">
        <img
          id="theme-toggleIcon"
          src="assets/sunny_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
          alt=""
        />
      </button>
    </header>
    <main>
      <section class="upperSection">
        <h1 id="topHeading">
          Find your next <span id="fav">Favorite</span> Movie
        </h1>
        <p id="topText">
          Search your favorite movies and discover thousands more.
        </p>
        <form class="Search-form"></form>
        <div class="btnWrapper">
          <input
            type="text"
            id="searchBox"
            placeholder="Search Your Favorite Movie"
            />
            <button class="genreBtn" id="Search">Search</button>
          </div>
        </section>
        <section class="genre">
        <button class="genreBtn" id="Popular">Popular</button>
        <button class="genreBtn" id="All">All</button>
        <button class="genreBtn" id="Action">Action</button>
        <button class="genreBtn" id="Adventure">Adventure</button>
        <button class="genreBtn" id="Animation">Animation</button>
        <button class="genreBtn" id="Comedy">Comedy</button>
        <button class="genreBtn" id="Crime">Crime</button>
        <button class="genreBtn" id="Drama">Drama</button>
        <button class="genreBtn" id="Horror">Horror</button>
        <button class="genreBtn" id="Romance">Romance</button>
        <button class="genreBtn" id="Sci-fi">Sci-fi</button>
        <button class="genreBtn" id="Thriller">Thriller</button>
      </section>
      <span id="MT">Popular Movies</span>
      <section class="genreSection" id="popularMovies">
        <div class="box">
          <img class="boxImg" src="assets/interstellar.jpg" alt="" />
          <span class="rating">⭐ 8.6</span>
          <span class="RD">2014</span>
        </div>
        <div class="box">
          <img class="boxImg" src="assets/the God Father.jpg" alt="" />
          <span class="rating">⭐ 9.2</span>
          <span class="RD">1972</span>
        </div>
        <div class="box">
          <img class="boxImg" src="assets/the Dark knight.jpg" alt="" />
          <span class="rating">⭐ 9.0</span>
          <span class="RD">2008</span>
        </div>
        <div class="box">
          <img
            class="boxImg"
            src="assets/the Shawshank Redemption.jpg"
            alt=""
          />
          <span class="rating">⭐ 9.7</span>
          <span class="RD">1994</span>
        </div>
        <div class="box">
          <img class="boxImg" src="assets/Inception.jpg" alt="" />
          <span class="rating">⭐ 9.8</span>
          <span class="RD">2010</span>
        </div>
        <div class="box">
          <img class="boxImg" src="assets/Avengers EndGame.jpg" alt="" />
          <span class="rating">⭐ 8.4</span>
          <span class="RD">2019</span>
        </div>
        <div id="resultBox" class="box">
          <img id="resultBoxPoster" class="boxImg" src="" alt="" />
          <span id="resultBoxSpan" class="rating"></span>
          <span id="resultReleaseDate" class="RD"></span>
        </div>
      </section>
      <section class="genreSection" id="searchMovies">
      </section>
      <section class="genreSection" id="allMovies"></section>
      <section class="genreSection" id="actionMovies"></section>
      <section class="genreSection" id="animationMovies"></section>
      <section class="genreSection" id="adventureMovies"></section>
      <section class="genreSection" id="horrorMovies"></section>
      <section class="genreSection" id="sci-fiMovies"></section>
      <section class="genreSection" id="romanceMovies"></section>
      <section class="genreSection" id="dramaMovies"></section>
      <section class="genreSection" id="thrillerMovies"></section>
      <section class="genreSection" id="comedyMovies"></section>
      <section class="genreSection" id="crimeMovies"></section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
